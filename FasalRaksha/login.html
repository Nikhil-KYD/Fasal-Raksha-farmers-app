<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fasal Raksha - Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-screen">

        <!-- Logo -->
        <div class="logo-section">
            <img src="assets/fasal-logo.png"
                 alt="Fasal Raksha Logo">

            <h1>Fasal Raksha</h1>

            <p id="welcome-text">
                Welcome to Fasal Raksha
            </p>
        </div>


        <!-- Login Card -->
        <div class="login-card">

            <h2 id="login-title">Login</h2>

            <p id="login-subtitle">
                Login to protect your crops
            </p>


            <!-- Mobile Number -->
            <label id="mobile-label">
                Mobile Number
            </label>

            <div class="input-group">

                <span>+91</span>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter mobile number"
                    maxlength="10"
                >

            </div>


            <!-- Password -->
            <label id="password-label">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >


            <!-- Login Button -->
            <button id="login-button" onclick="loginUser()">
                Login
            </button>


            <!-- Sign Up -->
            <p class="signup-text">

                <span id="signup-question">
                    Don't have an account?
                </span>

                <button
                    class="signup-button"
                    onclick="showSignup()"
                    id="signup-button">

                    Create Account

                </button>

            </p>

        </div>


        <!-- Back -->
        <button class="back-button" onclick="goBack()">
            ← <span id="back-text">Change Language</span>
        </button>

    </main>

    <!-- Custom Alert -->

<div id="custom-alert" class="alert-overlay">

    <div class="alert-box">

        <div id="alert-icon" class="alert-icon">
            ⚠️
        </div>

        <h3 id="alert-title">
            Error
        </h3>

        <p id="alert-message">
            Something went wrong.
        </p>

        <button id="alert-button" onclick="closeAlert()">
            OK
        </button>

    </div>

</div>


    <script src="js/login.js"></script>

</body>

</html>
