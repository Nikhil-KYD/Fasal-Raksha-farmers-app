<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fasal Raksha - My Crops</title>

    <link rel="stylesheet" href="css/crops.css">
</head>

<body>

    <main class="crops-page">

        <header class="crops-header">

            <button class="back-button" onclick="history.back()">
                ‹
            </button>

            <h1>My Crops</h1>

            <div class="header-space"></div>

        </header>


        <section class="crops-intro">

            <h2>Your crops</h2>

            <p>
                Your monitored crops will appear here.
            </p>

        </section>


        <section class="empty-state">

            <div class="empty-icon">
                +
            </div>

            <h3>No crops added yet</h3>

            <p>
                Add a crop to start monitoring its health.
            </p>

        </section>


        <button class="add-crop-button" id="add-crop-button">
            + Add Crop
        </button>

    </main>

    <script src="js/crops.js"></script>

</body>

</html>
