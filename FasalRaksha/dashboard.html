<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fasal Raksha - Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <main class="dashboard">
        <img src = "images/goofyahh.png" id = "goofy" class = "draggable" alt = "Goofy Image">

            <img src = "images/dumahhdog.jpg" id = "goofy2" class = "draggable" alt = "goody ahh 2">

        <!-- Header -->
        <header class="dashboard-header">

            <div class="brand">
                <img src="assets/fasal-logo.png"
                     alt="Fasal Raksha Logo">

                <h1>Fasal Raksha</h1>
            </div>

            <button class="profile-button">
                <img src = "images/profile.jpg" alt = "Profile Image">
            </button>

        </header>



        <!-- Welcome -->
        <section class="welcome">

            <h2>Hello, Farmer </h2>

            <p>
                Protect your crops with smarter technology.
            </p>

        </section>


        <!-- Scan Crop -->
        <section class="scan-card">

            <div class="scan-icon">
                <img src = "images/scanplanat.jpg"  alt = "Scan Icon">
            </div>

            <h2>Scan Your Crop</h2>

            <p>
                Take a photo of your crop to detect
                diseases and pests.
            </p>

            <button id="scan-button">
                Start Scan
            </button>

        </section>


        <!-- Quick Access -->
        <section class="quick-section">

            <h2>Quick Access</h2>

            <div class="quick-grid">

                <button class="quick-card">
                    <img src = "images/plantcute.png" alt = "My Crops Icon">
                    <p>My Crops</p>
                </button>

                <button class="quick-card">
                    <span>📊</span>
                    <p>Scan History</p>
                </button>

            </div>

        </section>


        <!-- Crop Health -->
        <section class="health-card">

            <h2>⚠️ Crop Health</h2>

            <p>
                No recent problems detected.
            </p>

        </section>

    </main>


    <script src="js/dashboard.js"></script>

</body>

</html>
