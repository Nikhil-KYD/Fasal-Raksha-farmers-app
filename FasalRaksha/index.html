<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FasalRaksha</title>

    <link rel="stylesheet" href="css/language.css">
</head>

<body>

    <main class="language-screen">

        <!-- Logo -->
        <div class="logo-section">

            <img src="assets/fasal-logo.png" alt="Fasal Raksha">

            <h1>Fasal Raksha</h1>

            <p><b>Detect Early. Act Smart. Save Crops.</b></p>

        </div>


        <!-- Language Selection -->
        <div class="language-box">

            <h2><b>अपनी भाषा चुनें</b></h2>

            <p class="english-text"><b>
                Select your language please.
                </b>
            </p>


            <!-- Hindi -->
            <button class="language-button" onclick="selectLanguage('hi')">

                <span class="language-icon">🇮🇳</span>

                <span class="language-name">
                    हिन्दी
                </span>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- English -->
            <button class="language-button" onclick="selectLanguage('en')">

                <span class="language-icon">🇬🇧</span>

                <span class="language-name">
                    English
                </span>

                <span class="arrow">
                    →
                </span>

            </button>

        </div>


        <!-- Footer -->
        <p class="footer-text"><b>
             Smart technology for better farming
            </b>
        </p>

    </main>


    <script src="js/language.js"></script>

</body>

</html>
